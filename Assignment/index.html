<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Web Notepad</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <i class="fa-solid fa-note-sticky brand-icon"></i>
          <span class="brand-name">Notepad Pro</span>
        </div>
      </div>

      <div class="sidebar-action">
        <button class="btn btn-primary btn-block" id="newNoteBtn">
          <i class="fa-solid fa-plus"></i> New Note
        </button>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search notes...">
      </div>

      <!-- Categories / Navigation Filters -->
      <nav class="nav-filters">
        <a href="#" class="nav-item active" data-filter="all">
          <i class="fa-solid fa-layer-group"></i> All Notes
          <span class="badge" id="countAll">0</span>
        </a>
        <a href="#" class="nav-item" data-filter="pinned">
          <i class="fa-solid fa-thumbtack"></i> Pinned
          <span class="badge" id="countPinned">0</span>
        </a>
        <a href="#" class="nav-item" data-filter="favorites">
          <i class="fa-solid fa-star"></i> Favorites
          <span class="badge" id="countFavorites">0</span>
        </a>
      </nav>

      <div class="tags-header">
        <span>TAGS</span>
      </div>
      <div class="tag-list" id="tagList">
        <!-- Tags rendered dynamically -->
      </div>

      <!-- Export / Import Actions -->
      <div class="sidebar-footer">
        <button class="btn btn-outline" id="exportBtn" title="Export JSON backup">
          <i class="fa-solid fa-download"></i> Export
        </button>
        <button class="btn btn-outline" id="importBtn" title="Import JSON backup">
          <i class="fa-solid fa-upload"></i> Import
        </button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </aside>

    <!-- Main Notes Grid List -->
    <section class="notes-section">
      <div class="section-header">
        <h2 id="sectionTitle">All Notes</h2>
        <div class="header-actions">
          <select id="sortSelect" class="form-select">
            <option value="updated">Last Modified</option>
            <option value="created">Date Created</option>
            <option value="title">Title (A-Z)</option>
          </select>
        </div>
      </div>

      <div class="notes-grid" id="notesGrid">
        <!-- Dynamic Note Cards Inserted Here -->
      </div>

      <div class="empty-state hidden" id="emptyState">
        <i class="fa-regular fa-folder-open empty-icon"></i>
        <h3>No notes found</h3>
        <p>Click "New Note" or adjust your search to start writing.</p>
      </div>
    </section>

    <!-- Interactive Note Writer/Editor Section -->
    <section class="editor-section hidden" id="editorSection">
      <div class="editor-header">
        <div class="editor-actions-left">
          <button class="btn btn-icon" id="closeEditorBtn" title="Close Editor">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <span class="editor-status" id="saveStatus"><i class="fa-solid fa-check"></i> Saved automatically</span>
        </div>
        <div class="editor-actions-right">
          <button class="btn btn-icon" id="pinNoteBtn" title="Pin Note">
            <i class="fa-regular fa-thumbtack"></i>
          </button>
          <button class="btn btn-icon" id="starNoteBtn" title="Star Note">
            <i class="fa-regular fa-star"></i>
          </button>
          <button class="btn btn-icon btn-danger" id="deleteNoteBtn" title="Delete Note">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        </div>
      </div>

      <div class="editor-body">
        <input type="text" id="noteTitle" class="editor-title-input" placeholder="Note Title..." autocomplete="off">
        
        <div class="editor-meta">
          <div class="meta-item">
            <i class="fa-solid fa-tag"></i>
            <input type="text" id="noteTags" class="editor-tags-input" placeholder="Tags (comma separated)...">
          </div>
          <div class="meta-item color-picker-wrapper">
            <i class="fa-solid fa-palette"></i>
            <div class="color-options" id="colorOptions">
              <button class="color-dot active" data-color="default" style="background:#ffffff;"></button>
              <button class="color-dot" data-color="red" style="background:#fee2e2;"></button>
              <button class="color-dot" data-color="amber" style="background:#fef3c7;"></button>
              <button class="color-dot" data-color="green" style="background:#dcfce7;"></button>
              <button class="color-dot" data-color="blue" style="background:#dbeafe;"></button>
              <button class="color-dot" data-color="purple" style="background:#f3e8ff;"></button>
            </div>
          </div>
        </div>

        <textarea id="noteContent" class="editor-textarea" placeholder="Write your note contents here..."></textarea>
      </div>

      <div class="editor-footer">
        <span id="wordCount">0 words</span>
        <span id="charCount">0 characters</span>
        <span id="lastModifiedTime">--</span>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
