<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Notepad</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <h1>Web Notepad</h1>

      <button id="newNoteBtn">
        + New Note
      </button>
    </header>

    <main>

      <section class="notes-section">

        <h2>My Notes</h2>

        <div id="notesGrid" class="notes-grid"></div>

        <div id="emptyState" class="empty-state">
          <h3>No notes yet</h3>
          <p>Create your first note to get started.</p>
        </div>

      </section>

      <section id="editorSection" class="editor hidden">

        <button id="closeEditorBtn" class="back-btn">
          ← Back
        </button>

        <input
          id="noteTitle"
          type="text"
          placeholder="Note title"
        >

        <textarea
          id="noteContent"
          placeholder="Write your note here..."
        ></textarea>

        <button id="deleteNoteBtn" class="delete-btn">
          Delete Note
        </button>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
